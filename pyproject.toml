[tool.poetry]
name = "msp-archive"
version = "0.2.0"
description = "MSP Archive Platform - 운영 기록 중심 플랫폼"
authors = ["MSP Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = {extras = ["email"], version = "^2.6.0"}
pydantic-settings = "^2.2.0"
pydantic-ai = "^0.0.30"
sqlalchemy = "^2.0.27"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
pgvector = { extras = ["asyncpg"], version = "^0.3.0" }
boto3 = "^1.34.0"
openai = "^1.12.0"
httpx = "^0.27.0"
python-multipart = "^0.0.9"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = "^1.7.4"
redis = "^5.0.1"
celery = "^5.3.6"
python-dateutil = "^2.8.2"
pydantic-core = "^2.16.0"
# Document parsing
pymupdf = "^1.24.0"
python-docx = "^1.1.0"
python-pptx = "^1.0.0"
openpyxl = "^3.1.0"
xlrd = "^2.0.1"
python-magic = "^0.4.27"
# SSE streaming
sse-starlette = "^2.0.0"
